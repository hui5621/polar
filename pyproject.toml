[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-route"
version = "0.1.0"
description = "S-IACO and SAG-PPO research code for polar route planning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.scripts]
polar-train = "polar_route.train:main"

[tool.setuptools.packages.find]
where = ["src"]
