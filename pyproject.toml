[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-route"
version = "0.1.0"
description = "S-IACO and SAG-PPO research code for polar route planning"
requires-python = ">=3.12.6,<3.13"
dependencies = ["numpy==2.2.4", "torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
